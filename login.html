<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERRA | Registro de Usuario</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="login.css">    
    <script src="script.js" defer></script>
</head>

<body>
    <div class="background-overlay"></div>
    
    <div class="contenedor-principal">
        <form id="formulario-registro" novalidate>
            <h2>Crea tu cuenta</h2>

            <div class="datos-entrada">
                <label for="nombredeusuario">Nombre de Usuario</label>
                <input type="text" id="nombredeusuario" placeholder="ej: dev_master" required minlength="4">
                <span class="mensaje-error">El usuario debe tener al menos 4 caracteres.</span>
            </div>
            <div class="datos-entrada">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" placeholder="tu@correo.com" required>
                <span class="mensaje-error">Ingresa un correo electrónico válido.</span>
            </div>
            <div class="datos-entrada">
                <label for="contraseña">Contraseña</label>
                <input type="password" id="contraseña" placeholder="••••••••" required pattern="^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$">
                <span class="mensaje-error">Mínimo 8 caracteres, incluyendo letras y números.</span>
                <div class="nivel-seguridad" id="nivel-seguridad"></div>
            </div>
            
            <button type="submit" id="botonenviar">Registrarme</button>
        </form>
        
        <div class="contenedor-retorno">
            <a href="index.html" class="btn-volver"><i class="fa-solid fa-arrow-left"></i> Volver a la revista</a>
        </div>
    </div>
</body>
</html>
